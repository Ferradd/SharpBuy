name: Render keep-alive

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after ~15 min idle
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-visitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake SharpBuy with synthetic visits
        env:
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          set -euo pipefail

          HOSTS=(
            "https://sharpbuy.org"
            "https://sharpbuy.onrender.com"
          )

          PATHS=(
            "/"
            "/api/keepalive"
            "/#instructions"
          )

          USER_AGENTS=(
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0"
            "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15"
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Edg/128.0.0.0 Safari/537.36"
          )

          # Random delay 0–90s so visits don't look perfectly periodic
          DELAY=$((RANDOM % 91))
          echo "Sleeping ${DELAY}s before ping..."
          sleep "$DELAY"

          pick() {
            local -n arr=$1
            echo "${arr[$((RANDOM % ${#arr[@]}))]}"
          }

          UA="$(pick USER_AGENTS)"
          PATH_PICK="$(pick PATHS)"
          SECRET_HEADER=()
          if [ -n "${KEEPALIVE_SECRET:-}" ]; then
            SECRET_HEADER=(-H "x-keepalive-secret: ${KEEPALIVE_SECRET}")
          fi

          for HOST in "${HOSTS[@]}"; do
            URL="${HOST}${PATH_PICK}"
            echo "Pinging ${URL}"
            curl -fsS --max-time 120 \
              -A "$UA" \
              -H "x-keepalive-source: github-actions" \
              "${SECRET_HEADER[@]}" \
              "$URL" \
              || echo "WARN: ping failed for ${URL}"
          done

          echo "Keep-alive cycle done."
